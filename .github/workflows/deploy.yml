name: Deploy production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, Linux, X64, mail-control-production]
    environment: production
    steps:
      - name: Deploy on production runner
        run: |
            set -Eeuo pipefail
            cd /opt/mail-control
            git fetch origin main
            git merge --ff-only origin/main
            docker compose --profile telegram build backend worker beat telegram_bot
            docker compose --profile telegram up -d --remove-orphans db redis migrate backend worker beat telegram_bot
            timeout 180 bash -c '
              until
                healthy=1
                for service in db redis backend worker beat telegram_bot; do
                  container_id=$(docker compose --profile telegram ps -q "$service")
                  if test -z "$container_id" || test "$(docker inspect --format "{{.State.Health.Status}}" "$container_id")" != healthy; then
                    healthy=0
                    break
                  fi
                done
                test "$healthy" -eq 1
              do sleep 5
              done
            '
            docker compose exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"
            curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8081/healthz
