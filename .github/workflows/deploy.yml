name: Deploy production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -Eeuo pipefail
            cd /opt/mail-control
            git fetch origin main
            git merge --ff-only origin/main
            docker compose build backend worker beat frontend
            docker compose up -d --remove-orphans
            timeout 180 bash -c 'until test "$(docker compose ps -q | wc -l)" -eq 6 && test "$(docker inspect --format "{{.State.Health.Status}}" $(docker compose ps -q) | grep -vc healthy)" -eq 0; do sleep 5; done'
            curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8081/api/health
