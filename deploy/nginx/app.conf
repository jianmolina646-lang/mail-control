# Proxy público para ecormecejhelizstore.com (SSL con Let's Encrypt).

server {
    listen 80;
    server_name panel.ecormecejhelizstore.com;

    # Reto ACME de Certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name panel.ecormecejhelizstore.com;

    ssl_certificate /etc/letsencrypt/live/panel.ecormecejhelizstore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.ecormecejhelizstore.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;

    # Seguridad básica.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
