# Proxy público para ecormecejhelizstore.com (SSL con Let's Encrypt).

limit_req_zone $binary_remote_addr zone=mailctl_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=mailctl_login:10m rate=10r/m;

server {
    listen 80;
    server_name panel.ecormecejhelizstore.com;
    server_tokens off;

    # Reto ACME de Certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name panel.ecormecejhelizstore.com;

    ssl_certificate /etc/letsencrypt/live/panel.ecormecejhelizstore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.ecormecejhelizstore.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;

    # Seguridad básica.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    location /api/ {
        limit_req zone=mailctl_api burst=40 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location = /api/auth/login {
        limit_req zone=mailctl_login burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
