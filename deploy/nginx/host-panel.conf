# Server block para el nginx DEL HOST (VPS compartido con la tienda).
# Sirve el panel en panel.ecormecejhelizstore.com y proxy-pasa al contenedor
# frontend publicado en 127.0.0.1:8081.
#
# Instalación:
#   sudo cp deploy/nginx/host-panel.conf /etc/nginx/sites-available/mail-control
#   sudo ln -s /etc/nginx/sites-available/mail-control /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d panel.ecormecejhelizstore.com

server {
    listen 80;
    server_name panel.ecormecejhelizstore.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
