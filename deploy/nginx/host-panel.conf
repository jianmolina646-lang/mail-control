# Server block para el nginx DEL HOST (VPS compartido con la tienda).
# Sirve el panel en panel.ecormecejhelizstore.com y proxy-pasa al contenedor
# frontend publicado en 127.0.0.1:8081.
#
# Instalación:
#   sudo cp deploy/nginx/host-panel.conf /etc/nginx/sites-available/mail-control
#   sudo ln -s /etc/nginx/sites-available/mail-control /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d panel.ecormecejhelizstore.com

limit_req_zone $binary_remote_addr zone=mailctl_host_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=mailctl_host_login:10m rate=10r/m;

server {
    listen 80;
    server_name panel.ecormecejhelizstore.com;

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        limit_req zone=mailctl_host_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location = /api/auth/login {
        limit_req zone=mailctl_host_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
