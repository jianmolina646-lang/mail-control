limit_req_zone $binary_remote_addr zone=mailctl_inner_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=mailctl_inner_login:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    # Docker puede asignar una IP nueva al backend cuando lo recrea. Resolver
    # el nombre en cada intervalo evita que Nginx conserve una IP obsoleta y
    # responda 502 hasta que el frontend también sea reiniciado.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mailctl_backend http://backend:8000;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # API -> backend FastAPI
    location /api/ {
        limit_req zone=mailctl_inner_api burst=40 nodelay;
        proxy_pass $mailctl_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location = /api/auth/login {
        limit_req zone=mailctl_inner_login burst=5 nodelay;
        proxy_pass $mailctl_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
