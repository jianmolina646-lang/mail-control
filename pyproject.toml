[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mail-control-enterprise"
version = "0.1.0"
description = "Mail Control Enterprise SaaS"
requires-python = ">=3.12"
dependencies = [
  "aio-pika==9.5.5",
  "alembic==1.16.5",
  "asyncpg==0.30.0",
  "fastapi==0.141.1",
  "argon2-cffi==25.1.0",
  "cryptography==50.0.1",
  "httpx==0.28.1",
  "PyJWT==2.13.0",
  "pydantic-settings==2.10.1",
  "redis==6.4.0",
  "sqlalchemy[asyncio]==2.0.43",
  "structlog==25.4.0",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mail_control"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["mail_control"]

[[tool.mypy.overrides]]
module = ["aio_pika.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jwt.*"]
ignore_missing_imports = true
